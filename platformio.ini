[platformio]
name = vizzz.di
core_dir = .platformio-core

[env:esp32dev]
; Pinned (audit 2026-10-15 1-L3) to what the 2026-10-15 build links:
; platform 7.0.1 -> framework-arduinoespressif32 3.20017 (Arduino core 2.0.17).
; Core 3.x renames WiFiUDP::flush() (RX drain) to clear(): do not float this.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 250000  ; = USB_WIDGET_BAUD (main.cpp): UART0 carries the log and the ENTTEC widget protocol

build_unflags =
  -fexceptions
build_flags =
  -fno-exceptions
  -DCORE_DEBUG_LEVEL=0
  -DSSE_MAX_QUEUED_MESSAGES=8  ; library default 32: a stalled /api/dmx/stream client holds at most 8 queued events (V5)
build_src_flags =
  -fno-threadsafe-statics

extra_scripts =
  pre:tools/pio_fw_version.py
  post:tools/flash_gate.py  ; fails the build under 128 KB free in the app slot (MIN_FREE_BYTES)

; esp_dmx is NOT in lib_deps: the patched copy in lib/esp_dmx (uart.c) is the
; one used (PlatformIO LDF searches lib_dir before .pio/libdeps); a second,
; unpatched registry copy only invited a silent swap.
lib_deps =
  me-no-dev/AsyncTCP@3.3.2
  me-no-dev/ESPAsyncWebServer@3.6.0
  bblanchon/ArduinoJson@7.4.2  ; /api/* POST bodies (plan step V4); exact pin

[env:native]
platform = native
test_framework = unity
build_flags =
  -I include
build_src_filter = -<*>
